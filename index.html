],bonus:{level:'2.4 ng/mL',symptoms:'噁心、嘔吐及心搏過緩',question:'藥師應特別警覺什麼狀況？',options:['可能的 Digoxin 中毒','預期治療效果','只有低血糖','無須擔心'],answer:0,explanation:'濃度高於 2 ng/mL，且伴隨腸胃道症狀與心搏過緩，須警覺可能為 Digoxin 中毒。應評估病人狀況，並依臨床需要適時升級處置。'},references:{toxicity:2,steadyNormal:'5–7 天',steadyESRD:'14–25 天',renal:'eGFR 10–50 mL/min：常用劑量的 25–75%',riskFactors:['腎功能不全','低血鉀','低血鎂','高血鈣','甲狀腺功能低下','缺氧'],adverseEffects:['噁心／嘔吐／腹瀉','心搏過緩','房室傳導阻滯','心室性心律不整','視覺異常','頭暈','精神狀態改變']}};
let current=0,score=0,answered=false,bonusDone=false;
const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function updateProgress(){let pct=Math.round((current/CONFIG.missions.length)*100);$('progress').style.width=pct+'%';$('progressLabel').textContent=current>=CONFIG.missions.length?'案件完成':`任務 ${current+1}／${CONFIG.missions.length}`;$('progressPct').textContent='完成 '+pct+'%';$('score').textContent=score}function facts(){let c=CONFIG.case;return `<div class="facts"><div class="fact"><small>病人</small><b>${c.age} 歲${c.sex} · ${c.weight}</b></div><div class="fact"><small>入院原因</small><b>${c.admission}</b></div><div class="fact"><small>心臟病史</small><b>HFrEF ${c.lvef} · ${c.history}</b></div><div class="fact"><small>目前劑量</small><b>Digoxin ${c.dose}</b></div><div class="fact"><small>腎功能</small><b>Scr ${c.scr} · CCr ${c.ccr}</b></div><div class="fact"><small>電解質／血中濃度</small><b>K ${c.potassium} · ${c.level}</b></div></div>`}function renderSide(){const c=CONFIG.case;$('sideCard').innerHTML=`<h3>📁 病人檔案</h3><p>調查線索時，請參考病人背景資料。</p>${facts()}<h3>⏱ 用藥時間軸</h3><div class="timeline"><div class="event"><time>9/9</time>Digoxin ${c.dose} 開始使用</div><div class="event"><time>9/10</time>給藥</div><div class="event"><time>9/11</time>給藥</div><div class="event"><time>${c.sample}</time>採集血液檢體 · ${c.level}</div></div><p class="note">參考目標：心衰竭 CHF ${c.targetCHF} · 心房顫動 AF ${c.targetAF} · 毒性警訊 &gt; ${CONFIG.references.toxicity} ng/mL<br><strong>臨床實務提醒：</strong>不論適應症，Digoxin 濃度建議不要超過 0.8 ng/mL。</p>`}function render(){answered=false;updateProgress();renderSide();if(current>=CONFIG.missions.length){renderFinal();return}let m=CONFIG.missions[current];let html=`<div class="mission-tag">任務 ${current+1} · ${esc(m.title)}</div><h2>${esc(m.title)}</h2><p class="intro">${esc(m.subtitle)}</p><div class="question">${esc(m.question)}</div>`;if(m.type==='recommendation'){html+=`<textarea class="textarea" id="recommendation" placeholder="請輸入你的臨床建議……"></textarea><button class="btn" id="submitRec">送出建議</button><div id="feedback" class="feedback"></div><div id="explanation"></div>`}else{html+=`<div class="options">${m.options.map((o,i)=>`<button class="option" data-index="${i}"><span class="letter">${String.fromCharCode(65+i)}.</span>${esc(o)}</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div><div id="explanation"></div><div id="followup"></div>`} $('mainCard').innerHTML=html;if(m.type==='recommendation')$('submitRec').onclick=submitRecommendation;else document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answerChoice(Number(b.dataset.index),m));}
function showFeedback(ok,text,explanation){$('feedback').className='feedback '+(ok?'ok':'no');$('feedback').textContent=(ok?'✓ ':'⚠ ')+text;if(explanation)$('explanation').innerHTML=`<div class="explain">${esc(explanation)}</div>`}function clue(){const c=$('clue');c.classList.remove('show');void c.offsetWidth;c.classList.add('show');setTimeout(()=>c.classList.remove('show'),1600)}function lockOptions(){document.querySelectorAll('.option').forEach(b=>b.disabled=true)}function advanceButton(parentId){const el=document.createElement('div');el.className='right-actions';el.innerHTML='<button class="btn" id="continueBtn">繼續 →</button>';$(parentId).appendChild(el);$('continueBtn').onclick=()=>{current++;render()}}
function answerChoice(idx,m){if(answered)return;answered=true;lockOptions();let ok=idx===m.answer;if(ok){score+=m.points||CONFIG.points.standard;let b=document.querySelector(`.option[data-index="${idx}"]`);b.classList.add('correct');showFeedback(true,'答對了！'+(m.points||CONFIG.points.standard)+' 分。',m.explanation);if(m.clue)clue()}else{document.querySelector(`.option[data-index="${idx}"]`).classList.add('incorrect');document.querySelector(`.option[data-index="${m.answer}"]`).classList.add('correct');showFeedback(false,'答錯了，請參考線索與解析。',m.explanation)}updateProgress();if(m.followup){renderFollowup(m.followup)}else{if(m.warning)$('explanation').innerHTML+=`<div class="warn">🚨 <b>注意</b><br>${esc(m.warning)}</div>`;advanceButton('mainCard')}}
function renderFollowup(f){$('followup').innerHTML=`<div class="question">${esc(f.question)}</div><div class="options">${f.options.map((o,i)=>`<button class="option" data-follow="${i}">${esc(o)}</button>`).join('')}</div><div id="followFeedback" class="feedback"></div><div id="followExplain"></div>`;document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-follow]').forEach(x=>x.disabled=true);let ok=Number(b.dataset.follow)===f.answer;if(ok){b.classList.add('correct');$('followFeedback').className='feedback ok';$('followFeedback').textContent='✓ 答對了！'}else{b.classList.add('incorrect');document.querySelector(`[data-follow="${f.answer}"]`).classList.add('correct');$('followFeedback').className='feedback no';$('followFeedback').textContent='⚠ 還不行。'}$('followExplain').innerHTML=`<div class="explain">${esc(f.explanation)}</div>`;advanceButton('mainCard')})}
function submitRecommendation(){if(answered)return;let val=$('recommendation').value.trim();if(!val){showFeedback(false,'請先輸入建議內容。');return}answered=true;$('recommendation').disabled=true;$('submitRec').disabled=true;let text=val.toLowerCase();let groups=[['穩定狀態前','未達穩定狀態','before steady state','not at steady state'],['維持原劑量','維持目前劑量','暫不調整','不調整劑量','continue the current dose'],['達穩定狀態後','穩定狀態後','after steady state'],['谷濃度','給藥前','下一次給藥前','trough','before the next dose'],['腎功能','肌酸酐','Scr','CCr','鉀','K+','K⁺'],['鎂','Mg','鈣','Ca','電解質','心率','心電圖']];let matched=groups.map(g=>g.some(k=>text.includes(k)));let ok=matched.every(Boolean);if(ok){score+=CONFIG.points.recommendation;showFeedback(true,`已包含主要建議重點，獲得 +${CONFIG.points.recommendation} 分。`,CONFIG.missions[7].reference);clue()}else showFeedback(false,'建議請補充：目前的劑量處置、穩定狀態後的谷濃度採血時間，以及腎功能、電解質與毒性徵象等追蹤項目。',`參考建議：${CONFIG.missions[7].reference}`);updateProgress();const bonusButton=document.createElement('button');bonusButton.className='btn secondary';bonusButton.textContent='前往額外挑戰 →';bonusButton.onclick=renderBonus;$('mainCard').appendChild(bonusButton)}
function renderBonus(){answered=false;let b=CONFIG.bonus;$('mainCard').innerHTML=`<div class="mission-tag">額外挑戰 · 毒性調查</div><h2>額外挑戰：Digoxin 毒性調查</h2><p class="intro">出現新的病例線索，請辨識症狀並評估風險。</p><div class="facts"><div class="fact"><small>Digoxin 血中濃度</small><b>${esc(b.level)}</b></div><div class="fact"><small>新出現的症狀</small><b>${esc(b.symptoms)}</b></div></div><div class="question">${esc(b.question)}</div><div class="options">${b.options.map((o,i)=>`<button class="option" data-bonus="${i}"><span class="letter">${String.fromCharCode(65+i)}.</span>${esc(o)}</button>`).join('')}</div><div id="bonusFeedback" class="feedback"></div><div id="bonusExplain"></div>`;document.querySelectorAll('[data-bonus]').forEach(btn=>btn.onclick=()=>{if(bonusDone)return;bonusDone=true;let ok=Number(btn.dataset.bonus)===b.answer;document.querySelectorAll('[data-bonus]').forEach(x=>x.disabled=true);if(ok){score+=CONFIG.points.bonus;btn.classList.add('correct');$('bonusFeedback').className='feedback ok';$('bonusFeedback').textContent=`✓ 答對了！額外獲得 ${CONFIG.points.bonus} 分。`;clue()}else{btn.classList.add('incorrect');document.querySelector(`[data-bonus="${b.answer}"]`).classList.add('correct');$('bonusFeedback').className='feedback no';$('bonusFeedback').textContent='⚠ 請再看看中毒線索。'}$('bonusExplain').innerHTML=`<div class="explain">${esc(b.explanation)}</div>`;updateProgress();advanceButton('mainCard')});$('sideCard').innerHTML=`<h3>🧭 中毒風險線索</h3><p>請留意下列風險因子：</p><p>${CONFIG.references.riskFactors.map(esc).join(' · ')}</p><h3>可能的不良反應</h3><p>${CONFIG.references.adverseEffects.map(esc).join(' · ')}</p>`}
function renderFinal(){let rating=score>=105?'Digoxin TDM 偵探':score>=80?'臨床推理不錯':'繼續調查、累積經驗！';let stars=score>=105?'⭐⭐⭐':score>=80?'⭐⭐':'⭐';$('progress').style.width='100%';$('progressPct').textContent='完成 100%';$('mainCard').innerHTML=`<div class="result"><div class="mission-tag">案件結案</div><div class="stars">${stars}</div><h2>${rating}</h2><div class="result-score">${score}<span style="font-size:20px;color:#a5b7ca">／130 分</span></div><p class="intro">本遊戲結果僅代表學習進度，不代表臨床能力評級。</p></div><h3>Digoxin TDM 評估檢核表</h3><ul class="checklist"><li>確認適應症</li><li>檢視劑量</li><li>檢查腎功能</li><li>確認採檢時間</li><li>確認是否達穩定狀態</li><li>解讀血中濃度</li><li>評估中毒風險</li><li>提出臨床建議</li></ul><div class="warn" style="text-align:center;font-size:18px;margin-top:20px">「切勿只看數字就解讀 Digoxin 血中濃度。」</div><button class="btn" id="restart">↻ 重新開始遊戲</button><p class="note">本遊戲依據提供的院內參考資料製作；實際處置請依院內規範及臨床評估。</p>`;$('restart').onclick=restart;$('sideCard').innerHTML=`<h3>🔎 調查完成</h3><p>你已完成適應症、劑量、腎功能、採檢時間、穩定狀態、濃度、中毒風險與藥師建議的評估。</p><p>目前劑量： ${esc(CONFIG.case.dose)}<br>CCr：${esc(CONFIG.case.ccr)}<br>採檢時間：${esc(CONFIG.case.sample)}</p><h3>請記住</h3><p>本案例建議先維持目前劑量，待達穩定狀態後重新檢測谷濃度，再評估是否調整。</p>`}
function restart(){current=0;score=0;answered=false;bonusDone=false;render()}render();
</script></body></html>
